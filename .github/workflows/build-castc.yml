# Builds a Linux x86_64 `castc` binary and runs the full example test suite.
#
# Instead of building LLVM + MLIR + CIRCT from source (the readme flow: hours
# and ~50 GB), this uses the prebuilt `circt-full-static-linux-x64` package
# from the CIRCT release nearest the commit the readme pins:
#   readme pins CIRCT 7f76cbc26 (2026-03-19); firtool-1.143.0 was tagged
#   2026-03-23, four days later.
#
# Runner must be ubuntu-24.04: that prebuilt package references glibc 2.38+
# symbols (__isoc23_strtoll, arc4random), so linking on 22.04 fails.
#
# Because the runner's glibc is newer than some deployment targets (e.g. the
# ORBIT node images), the job first tries a fully static link so the binary
# carries its own libc and runs anywhere, falling back to a dynamic link if
# that is not possible. Check the "link mode" output to see which you got.
#
# Trigger from the Actions tab ("build castc" -> Run workflow). The binary is
# uploaded as the `castc-linux-x64` artifact; scp it onto a node as
# <repo>/build/castc and simulate.sh works as-is. A `build-logs` artifact
# holds the full configure/build output.

name: build castc

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - "examples/**"
      - "tests/**"
      - ".github/workflows/build-castc.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang iverilog zlib1g-dev libzstd-dev

      - name: Download and unpack prebuilt CIRCT (firtool-1.143.0)
        run: |
          curl -L --retry 3 -o circt.tar.gz \
            https://github.com/llvm/circt/releases/download/firtool-1.143.0/circt-full-static-linux-x64.tar.gz
          ls -lh circt.tar.gz
          mkdir -p circt-install
          # Tarball has a single top-level dir; strip it to get a plain prefix.
          tar -xzf circt.tar.gz --strip-components=1 -C circt-install
          echo "CIRCT_PREFIX=$PWD/circt-install" >> "$GITHUB_ENV"

      - name: Verify cmake packages are present
        run: |
          echo "prefix contents:"; ls "$CIRCT_PREFIX"
          for p in llvm mlir circt; do
            d="$CIRCT_PREFIX/lib/cmake/$p"
            if [ ! -d "$d" ]; then
              echo "::error::missing cmake package dir $d"
              find "$CIRCT_PREFIX" -maxdepth 4 -name '*Config.cmake' | head -20
              exit 1
            fi
            echo "found $d"
          done

      - name: Configure and build castc (static preferred)
        id: compile
        run: |
          common=(
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_PREFIX_PATH=$CIRCT_PREFIX
            -DLLVM_DIR=$CIRCT_PREFIX/lib/cmake/llvm
            -DMLIR_DIR=$CIRCT_PREFIX/lib/cmake/mlir
            -DCIRCT_DIR=$CIRCT_PREFIX/lib/cmake/circt
          )
          echo "=== attempt 1: fully static link ==="
          # Prefer .a when resolving system deps (zlib/zstd) so -static works.
          if cmake -S . -B build "${common[@]}" \
                 -DCMAKE_FIND_LIBRARY_SUFFIXES=".a" \
                 -DCMAKE_EXE_LINKER_FLAGS="-static" > configure.log 2>&1 \
             && ninja -C build castc > build.log 2>&1; then
            echo "link mode: STATIC (portable across glibc versions)"
            echo "LINK_MODE=static" >> "$GITHUB_ENV"
          else
            echo "static link did not succeed; last lines were:"
            tail -25 build.log 2>/dev/null || tail -25 configure.log 2>/dev/null || true
            echo "=== attempt 2: dynamic link ==="
            rm -rf build
            cmake -S . -B build "${common[@]}" \
              -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
              > configure.log 2>&1
            ninja -C build castc > build.log 2>&1
            echo "link mode: DYNAMIC (needs glibc >= runner's on the target)"
            echo "LINK_MODE=dynamic" >> "$GITHUB_ENV"
          fi

      - name: Show compile/link errors
        if: failure() && steps.compile.outcome == 'failure'
        run: |
          echo "=== errors ==="
          grep -nE 'error:|undefined reference' build.log | head -40 || true
          echo "=== build.log tail ==="
          tail -60 build.log 2>/dev/null || true
          echo "=== configure.log tail ==="
          tail -40 configure.log 2>/dev/null || true

      - name: Report binary portability
        run: |
          file build/castc
          echo "link mode: $LINK_MODE"
          echo "--- dynamic deps (none if static) ---"
          ldd build/castc || true
          echo "--- max glibc symbol version required ---"
          objdump -T build/castc 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -3 \
            || echo "(static: no versioned glibc imports)"

      - name: Smoke test (compile an example to Verilog)
        run: |
          ./build/castc --tb examples/counter.cast > /tmp/counter.sv
          head -20 /tmp/counter.sv
          iverilog -g2012 -gno-assertions -o /tmp/counter_sim /tmp/counter.sv
          timeout 30 vvp /tmp/counter_sim | head -15

      # Non-fatal: a behavioural test failure should still yield a binary.
      - name: Run full example suite (ninja check)
        id: check
        continue-on-error: true
        run: ninja -C build check

      - name: Prepare binary
        if: always()
        run: |
          if [ -f build/castc ]; then
            strip build/castc || true
            ls -lh build/castc
          else
            echo "::warning::build/castc was not produced"
          fi

      - name: Upload castc artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: castc-linux-x64
          path: build/castc
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            configure.log
            build.log
          if-no-files-found: ignore
